<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty Articles</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: url("https://eu-images.contentstack.com/v3/assets/blt09e5e63517a16184/blt0f7c0b85d493f338/64d6a1178adb3128624da69e/Untitled_20design_2025.png?width=1280&auto=webp&quality=95&format=jpg&disable=upscale")
          center/cover fixed;
        color: white;
      }
      .card {
        background: rgba(255, 255, 255, 0.9);
        color: black;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Beauty Articles</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="/">Home</a>
              <a class="nav-link active" href="/liputan6">Liputan6</a>
              <a class="nav-link" href="/womenpedia">Womenpedia</a>
              <a class="nav-link" href="/beautynesia">Beautynesia</a>
            </div>
          </div>
        </div>
      </nav>


    <div class="container my-5">
      <h1 class="text-center mb-4">Artikel Beauty dari Liputan6</h1>
      {% if articles %}
      <div class="row">
        {% for article in articles %}
        <div class="col-md-4 mb-4">
          <div class="card">
            <img src="{{ article.img_src }}" alt="{{ article.img_alt }}" class="card-img-top" />
            <div class="card-body">
              <h5 class="card-title">
                <a href="{{ article.link }}" target="_blank">{{ article.title }}</a>
              </h5>
              <p class="card-text">Waktu: {{ article.time }}</p>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="alert alert-warning text-center">Tidak ada artikel yang ditemukan.</div>
      {% endif %}
    </div>
  </body>
</html>
